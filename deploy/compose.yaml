services:
  replydesk-api:
    build: .
    env_file: .env
    restart: unless-stopped
    networks: [web]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8010/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

networks:
  web:
    external: true
